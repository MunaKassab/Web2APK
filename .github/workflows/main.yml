name: Build Web2APK

on:
  workflow_dispatch:
    inputs:
      icon_path:
        description: App icon path
        required: true
        default: icon.webp
      app_name:
        description: Android App Name
        required: true
        default: SANA STORE BILLING

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: pip install colorama

      - name: Create Website ZIP
        run: |
          zip -j website.zip index.html

      - name: Build APK
        run: |
          python wa.py \
            -zip "website.zip" \
            -icon "${{ inputs.icon_path }}" \
            -name "${{ inputs.app_name }}"

      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: SANA-STORE-ANDROID-APK
          path: dist/*.apk
